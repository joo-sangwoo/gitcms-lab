<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 댓글</title>
<style>
  body {
    margin: 0;
    font: 15px/1.7 -apple-system, sans-serif;
    color: #1a1a1a;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid #e4e4e4;
  }

  header .grow { flex: 1; }

  #me { color: #2f6f4f; }

  main {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr) 320px;
    gap: 24px;
    padding: 24px 18px;
  }

  nav a {
    display: block;
    padding: 6px 8px;
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }

  article h1 {
    margin-top: 0;
  }

  aside {
    border-left: 1px solid #e4e4e4;
    padding-left: 18px;
  }
    article pre {
    background: #f7f7f7;
    padding: 12px 14px;
    border-radius: 8px;
    overflow: auto;
  }

  article pre code {
    background: none;
    padding: 0;
  }
    .cbtn {
    margin-left: 8px;
    border: 1px solid #e4e4e4;
    background: #fff;
    color: #6b6b6b;
    border-radius: 999px;
    min-width: 24px;
    height: 22px;
    font-size: 12px;
    cursor: pointer;
    vertical-align: middle;
  }

  .cbtn.on {
    border-color: #2f6f4f;
    color: #2f6f4f;
    font-weight: 600;
  }

  .sec.live {
    background: #fff6d8;
    border-radius: 6px;
  }

  .card {
    border: 1px solid #e4e4e4;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }

  .card .anchor {
    font-size: 11px;
    color: #2f6f4f;
    word-break: break-all;
  }

  .msg {
    border-top: 1px dashed #e4e4e4;
    padding-top: 6px;
    margin-top: 6px;
    font-size: 14px;
  }

  .msg .who {
    font-size: 11px;
    color: #6b6b6b;
  }

  .card.resolved {
    opacity: .5;
  }

  .gone {
    font-size: 11px;
    color: #a4552b;
  }

  .act {
    border: 1px solid #e4e4e4;
    background: #fff;
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 12px;
    cursor: pointer;
  }

  textarea {
    width: 100%;
    border: 1px solid #e4e4e4;
    border-radius: 6px;
    padding: 6px;
    font: inherit;
    resize: vertical;
    margin: 6px 0;
  }
</style>
</head>
<body>
<header>
  <strong>문서 댓글</strong>
  <small id="build"></small>
  <span class="grow"></span>
  <button class="act" id="tokenBtn">토큰</button>
  <small id="me"></small>
</header>

<main>
  <nav id="nav"></nav>
  <article id="doc"></article>
  <aside id="panel"></aside>
</main>
<script>
let BUNDLE = null;
const state = { docId: null, anchor: null };

const $ = (selector) => document.querySelector(selector);
const doc = () => BUNDLE.docs.find((item) => item.id === state.docId);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const threads = (id) => BUNDLE.comments[id] || [];

function renderNav() {
  $("#nav").innerHTML = BUNDLE.docs.map((item) =>
    `<a data-doc="${item.id}">${item.title}</a>`
  ).join("");
}

function renderDoc() {
  const current = doc();

  $("#doc").innerHTML = current.blocks.map((block) => {
    if (block.type === "code") {
      return `<pre><code>${esc(block.text)}</code></pre>`;
    }

    if (block.type === "ul") {
      return `<ul>${block.items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
    }

    if (!block.anchor) {
      return `<${block.type}>${block.html}</${block.type}>`;
    }

    const open = threads(current.id)
      .filter((t) => t.anchor === block.anchor && !t.resolved).length;
    const live = state.anchor === block.anchor ? " live" : "";

    return `<${block.type} class="sec${live}">${block.html}` +
      `<button class="cbtn${open ? " on" : ""}" data-anchor="${block.anchor}">` +
      `${open || "+"}</button></${block.type}>`;
  }).join("");
}

function renderPanel() {
  const current = doc();
  const live = new Set(
    current.blocks.filter((b) => b.anchor).map((b) => b.anchor)
  );
  const list = threads(current.id)
    .filter((t) => !state.anchor || t.anchor === state.anchor);

  // 앵커를 고른 상태에서만 입력창을 띄운다. 어디에 붙일지 정해져야 쓸 수 있다.
  const head = state.anchor
    ? `<div class="card">
         <div class="anchor">${esc(state.anchor)}</div>
         <textarea id="newBody" rows="3" placeholder="새 댓글"></textarea>
         <button class="act" data-act="create">등록</button>
         <button class="act" data-act="clear">취소</button>
       </div>`
    : `<small>제목 옆 버튼으로 앵커를 고릅니다</small>`;

  const cards = list.length
    ? list.map((t) => `
        <div class="card ${t.resolved ? "resolved" : ""}">
          <div class="anchor">${esc(t.anchor)}
            ${live.has(t.anchor) ? "" : `<span class="gone">· 사라진 섹션</span>`}
          </div>
          ${t.messages.map((m) => `
            <div class="msg">
              <div class="who">${esc(m.who)} · ${esc(m.when)}</div>
              ${esc(m.body)}
            </div>`).join("")}
        </div>`).join("")
    : `<small>이 앵커에는 댓글이 없습니다</small>`;

  // 커밋은 됐어도 Pages 재빌드 전이라 새로고침하면 사라진다. 그 간극을 알린다.
  const pending = state.pending
    ? `<div class="gone">저장됨 · 배포 반영까지 1~2분</div>`
    : "";

  $("#panel").innerHTML =
    `<div style="margin-bottom:10px">${head}${pending}</div>${cards}`;
}

function render() {
  renderNav();
  renderDoc();
  renderPanel();
}

// 저장은 비동기라 핸들러 자체를 async 로 바꾼다.
document.addEventListener("click", async (event) => {
  const el = event.target.closest("[data-doc],[data-anchor],[data-act]");
  if (!el) return;

  // 저장은 실패할 수 있으므로 아래 화면 전환 분기와 분리해 처리한다.
  if (el.dataset.act === "create") {
    try {
      await runAction("create");
    } catch (err) {
      // CONFLICT 는 우리 검사, 나머지는 GitHub 이 준 상태 코드다.
      alert(err.message === "CONFLICT"
        ? "다른 사람이 먼저 저장했습니다. 새로고침한 뒤 다시 작성하세요."
        : `저장 실패: ${err.message}`);
    }
    return;
  }

  if (el.dataset.act === "clear") {
    state.anchor = null;
  } else if (el.dataset.doc) {
    state.docId = el.dataset.doc;
    state.anchor = null;
  } else {
    state.anchor = state.anchor === el.dataset.anchor ? null : el.dataset.anchor;
  }

  render();
});

/* ══ 토큰 ══════════════════════════════════════════════════════════════
   코드에 비밀값을 두지 않는다. 사용자가 자기 토큰을 넣는다. */
const token = () => localStorage.getItem("gh_token") || "";

$("#tokenBtn").onclick = async () => {
  const value = prompt("GitHub fine-grained PAT", token());
  if (value === null) return;

  localStorage.setItem("gh_token", value.trim());

  try {
    await verifyToken();
  } catch (err) {
    $("#me").textContent = "";
    alert(`토큰 확인 실패: ${err.message}`);
  }
};

async function verifyToken() {
  const user = await gh("/user");
  $("#me").textContent = user.login;
}

/* ══ GitHub REST ══════════════════════════════════════════════════════ */
async function gh(path, options = {}) {
  const response = await fetch("https://api.github.com" + path, {
    method: options.method || "GET",
    headers: {
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      "Authorization": `Bearer ${token()}`,
      ...(options.body ? { "Content-Type": "application/json" } : {}),
    },
    body: options.body,
  });

  if (!response.ok) {
    const text = (await response.text()).slice(0, 200);
    const error = new Error(`${response.status} ${text}`);
    error.status = response.status;
    throw error;
  }

  return response.status === 204 ? null : response.json();
}
/* ══ YAML 출력 ═════════════════════════════════════════════════════════
   스키마가 고정이라 직접 쓴다. 문자열은 JSON.stringify 로 감싼다.
   YAML 1.2 는 JSON 의 상위집합이라 JSON 문자열이 그대로 유효한
   YAML 큰따옴표 스칼라다. 줄바꿈·따옴표·콜론을 따로 처리할 필요가 없다. */
function dumpComments(list) {
  const out = [];

  for (const t of list) {
    out.push(`- id: ${t.id}`);
    out.push(`  anchor: ${JSON.stringify(t.anchor)}`);
    out.push(`  rev: ${JSON.stringify(t.rev ?? "—")}`);
    out.push(`  resolved: ${t.resolved === true}`);
    out.push(`  messages:`);

    for (const m of t.messages) {
      out.push(`    - who: ${JSON.stringify(m.who)}`);
      out.push(`      when: ${JSON.stringify(m.when)}`);
      out.push(`      body: ${JSON.stringify(m.body)}`);
    }

    out.push("");
  }

  return out.join("\n");
}

/* btoa 는 Latin1 만 받는다. 한글은 UTF-8 바이트로 먼저 바꿔야 한다. */
function b64(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = "";

  for (const byte of bytes) {
    binary += String.fromCharCode(byte);
  }

  return btoa(binary);
}

/* ══ 저장 ══════════════════════════════════════════════════════════════
   파일을 통째로 바꿔 커밋한다. 배열을 어떻게 바꿀지는 mutate 가 정한다.
   6단계의 답글·해결도 같은 흐름이라 이 함수 하나를 공유한다.
   나중에 workflow_dispatch 방식으로 옮길 때도 여기만 갈아끼우면 된다. */
async function save(mutate, message) {
  // 인증 없이 호출하면 401 이 난다. 그 전에 걸러 낸다.
  if (!token()) throw new Error("토큰을 먼저 넣으세요");

  const docId = state.docId;
  const path = `comments/${docId}.yaml`;
  const { repo, branch } = BUNDLE.config;

  // 현재 GitHub 에 있는 파일을 읽는다. 아직 없는 문서면 404 가 나는데,
  // 그건 오류가 아니라 "새로 만들어야 한다"는 뜻이므로 통과시킨다.
  let current = null;

  try {
    current = await gh(`/repos/${repo}/contents/${path}?ref=${branch}`);
  } catch (err) {
    if (err.status !== 404) throw err;
  }

  // 화면이 만들어질 때의 파일과 지금 파일이 같은지 본다.
  // 다르면 내가 보고 있는 댓글 목록이 이미 낡았다는 뜻이라 멈춘다.
  const known = BUNDLE.commentsMeta[docId]?.sha ?? null;
  if ((current?.sha ?? null) !== known) throw new Error("CONFLICT");

  // 메모리의 배열을 바꾼다. 아직 GitHub 에는 아무 영향이 없다.
  mutate(threads(docId));

  // 바뀐 배열을 YAML 로 만들어 파일 전체를 덮어쓴다.
  // sha 는 "이 버전을 고친다"는 뜻이고, 그새 바뀌었으면 GitHub 이 409 로 막는다.
  const result = await gh(`/repos/${repo}/contents/${path}`, {
    method: "PUT",
    body: JSON.stringify({
      message,
      content: b64(dumpComments(threads(docId))),
      branch,
      ...(current ? { sha: current.sha } : {}),
    }),
  });

  // 방금 만든 파일 상태를 새 기준으로 삼는다.
  // 안 하면 두 번째 저장부터 전부 CONFLICT 로 막힌다.
  BUNDLE.commentsMeta[docId] = { sha: result.content.sha };

  // 저장은 됐지만 배포 전이라 화면과 실제 사이트가 잠시 다르다.
  state.pending = true;
  render();
}

/* 화면의 버튼을 저장으로 연결한다. 6단계에서 답글·해결이 여기 붙는다. */
async function runAction(act, id) {
  if (act === "create") {
    // 저장이 끝나기 전에 다시 눌리면 같은 댓글이 두 번 나간다.
    // 두 요청이 같은 시점의 sha 를 들고 출발해 나중 것이 409 로 막힌다.
    const button = document.querySelector('[data-act="create"]');
    if (button.disabled) return;
    button.disabled = true;

    // 빈 댓글은 저장하지 않는다.
    const body = $("#newBody").value.trim();
    if (!body) {
      button.disabled = false;
      return;
    }

    // save 안에서 render 가 돌면 입력창이 사라지므로 값을 먼저 꺼내 둔다.
    const anchor = state.anchor;
    const rev = doc().rev.sha;      // 작성 시점의 문서 커밋. 나중에 낡음 판정에 쓴다
    const who = $("#me").textContent || "unknown";
    const when = new Date().toISOString().slice(0, 10);

    await save((list) => {
      // id 는 파일 안에서만 유일하면 된다. 동시 작성이 겹치면 PR 에서 드러난다.
      const nextId = Math.max(0, ...list.map((t) => t.id)) + 1;

      list.push({
        id: nextId, anchor, rev, resolved: false,
        messages: [{ who, when, body }],
      });
    }, `comments(${state.docId}): 새 댓글`);
  }
}

(async function boot() {
  BUNDLE = await (
    await fetch("data/bundle.json", { cache: "no-store" })
  ).json();

  state.docId = BUNDLE.docs[0]?.id ?? null;
  $("#build").textContent = `빌드 ${BUNDLE.buildSha}`;
  if (token()) verifyToken().catch(() => {});
  render();
})();
</script>
</body>
</html>
