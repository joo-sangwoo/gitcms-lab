<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 댓글</title>
<style>
  body {
    margin: 0;
    font: 15px/1.7 -apple-system, sans-serif;
    color: #1a1a1a;
  }

  header {
    padding: 12px 18px;
    border-bottom: 1px solid #e4e4e4;
  }

  main {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr) 320px;
    gap: 24px;
    padding: 24px 18px;
  }

  nav a {
    display: block;
    padding: 6px 8px;
    color: inherit;
    text-decoration: none;
  }

  article h1 {
    margin-top: 0;
  }

  aside {
    border-left: 1px solid #e4e4e4;
    padding-left: 18px;
  }
</style>
</head>
<body>
<header>
  <strong>문서 댓글</strong>
  <small id="build"></small>
</header>

<main>
  <nav id="nav"></nav>
  <article id="doc"></article>
  <aside id="panel"></aside>
</main>
</body>
</html>
