<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 댓글</title>
<style>
  body {
    margin: 0;
    font: 15px/1.7 -apple-system, sans-serif;
    color: #1a1a1a;
  }

  header {
    padding: 12px 18px;
    border-bottom: 1px solid #e4e4e4;
  }

  main {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr) 320px;
    gap: 24px;
    padding: 24px 18px;
  }

  nav a {
    display: block;
    padding: 6px 8px;
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }

  article h1 {
    margin-top: 0;
  }

  aside {
    border-left: 1px solid #e4e4e4;
    padding-left: 18px;
  }
    article pre {
    background: #f7f7f7;
    padding: 12px 14px;
    border-radius: 8px;
    overflow: auto;
  }

  article pre code {
    background: none;
    padding: 0;
  }
</style>
</head>
<body>
<header>
  <strong>문서 댓글</strong>
  <small id="build"></small>
</header>

<main>
  <nav id="nav"></nav>
  <article id="doc"></article>
  <aside id="panel"></aside>
</main>
<script>
let BUNDLE = null;
const state = { docId: null };

const $ = (selector) => document.querySelector(selector);
const doc = () => BUNDLE.docs.find((item) => item.id === state.docId);

function renderNav() {
  $("#nav").innerHTML = BUNDLE.docs.map((item) =>
    `<a data-doc="${item.id}">${item.title}</a>`
  ).join("");
}

function renderDoc() {
  const current = doc();

  $("#doc").innerHTML = current.blocks.map((block) => {
    if (block.type === "code") {
      return `<pre><code>${block.text}</code></pre>`;
    }

    if (block.type === "ul") {
      return `<ul>${block.items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
    }

    return `<${block.type}>${block.html}</${block.type}>`;
  }).join("");
}

function render() {
  renderNav();
  renderDoc();
}

document.addEventListener("click", (event) => {
  const link = event.target.closest("[data-doc]");
  if (!link) return;

  state.docId = link.dataset.doc;
  render();
});

(async function boot() {
  BUNDLE = await (
    await fetch("data/bundle.json", { cache: "no-store" })
  ).json();

  state.docId = BUNDLE.docs[0]?.id ?? null;
  $("#build").textContent = `빌드 ${BUNDLE.buildSha}`;
  render();
})();
</script>
</body>
</html>
